<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A股持仓观察面板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --red: #ef4444;
      --green: #16a34a;
      --blue: #2563eb;
      --amber: #d97706;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f7f2ea 0%, var(--bg) 42%, #eef2ff 100%);
      color: var(--text);
    }
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -0.03em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      min-width: 170px;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--text);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }
    .timestamp {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }
    .card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .value {
      font-size: clamp(22px, 3vw, 31px);
      font-weight: 760;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
    .positive { color: var(--red); }
    .negative { color: var(--green); }
    .neutral { color: var(--text); }
    .panel {
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(229, 231, 235, 0.8);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      background: #fafafa;
    }
    tr:last-child td { border-bottom: 0; }
    .stock-name {
      font-weight: 720;
      margin-bottom: 4px;
    }
    .code {
      color: var(--muted);
      font-size: 13px;
    }
    .weight {
      min-width: 110px;
    }
    .bar {
      height: 9px;
      width: 100%;
      border-radius: 999px;
      background: #eef2f7;
      margin-top: 7px;
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #60a5fa, #2563eb);
    }
    .signals {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      white-space: normal;
      min-width: 210px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      background: #eef2ff;
      color: #3730a3;
    }
    .badge.warn {
      background: #fff7ed;
      color: #c2410c;
    }
    .badge.danger {
      background: #fef2f2;
      color: #b91c1c;
    }
    .notice {
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .error {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      background: #fef2f2;
      color: #b91c1c;
    }

    @media (max-width: 900px) {
      .hero { flex-direction: column; }
      .actions { align-items: flex-start; }
      .timestamp { text-align: left; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .panel { overflow-x: auto; }
    }

    @media (max-width: 540px) {
      .page { padding: 24px 14px 38px; }
      .cards { grid-template-columns: 1fr; }
      th, td { padding: 14px 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <h1>A股持仓观察面板</h1>
        <p class="subtitle">跟踪当前持仓市值、浮盈亏、仓位占比和风险信号。数据来自公开行情接口，仅用于观察和复盘。</p>
      </div>
      <div class="actions">
        <button id="refresh">刷新行情</button>
        <div class="timestamp" id="timestamp">等待加载...</div>
      </div>
    </section>

    <div class="error" id="error"></div>

    <section class="cards">
      <div class="card">
        <div class="label">组合市值</div>
        <div class="value" id="marketValue">--</div>
      </div>
      <div class="card">
        <div class="label">组合成本</div>
        <div class="value" id="cost">--</div>
      </div>
      <div class="card">
        <div class="label">组合浮盈亏</div>
        <div class="value" id="profit">--</div>
      </div>
      <div class="card">
        <div class="label">组合收益率</div>
        <div class="value" id="profitPercent">--</div>
      </div>
    </section>

    <section class="panel">
      <table>
        <thead>
          <tr>
            <th>股票</th>
            <th>现价</th>
            <th>涨跌幅</th>
            <th>持仓</th>
            <th>市值</th>
            <th>浮盈亏</th>
            <th>仓位</th>
            <th>观察信号</th>
          </tr>
        </thead>
        <tbody id="positions">
          <tr><td colspan="8">正在加载行情...</td></tr>
        </tbody>
      </table>
    </section>

    <p class="notice" id="notice">公开行情可能延迟或临时不可用；本面板不构成投资建议，也不会执行任何交易。</p>
  </main>

  <script>
    window.__PORTFOLIO_DATA__ = {"generatedAt": "2026-06-23T07:26:59", "quoteTime": "2026-06-23 15:26:00", "totals": {"cost": 437935.89, "marketValue": 462351.57, "profit": 24415.68, "profitPercent": 5.58}, "positions": [{"code": "688027", "name": "国盾量子", "shares": 387, "cost": 520.1536, "currentPrice": 522.11, "changePercent": 0.81, "marketValue": 202056.57, "profit": 757.13, "profitPercent": 0.38, "signals": ["接近成本线"], "weightPercent": 43.7}, {"code": "002214", "name": "*ST大立", "shares": 4300, "cost": 22.9626, "currentPrice": 15.05, "changePercent": -0.66, "marketValue": 64715.0, "profit": -34024.18, "profitPercent": -34.46, "signals": ["跌破成本", "亏损超过30%，重点复盘", "ST风险优先看公告"], "weightPercent": 14.0}, {"code": "300604", "name": "长川科技", "shares": 700, "cost": 196.9961, "currentPrice": 279.4, "changePercent": 4.06, "marketValue": 195580.0, "profit": 57682.73, "profitPercent": 41.83, "signals": ["浮盈超过30%，关注盈利保护"], "weightPercent": 42.3}], "disclaimer": "公开行情可能延迟或临时不可用；本面板只用于观察和复盘，不构成投资建议。"};
  </script>
  <script>
    const elements = {
      refresh: document.querySelector("#refresh"),
      timestamp: document.querySelector("#timestamp"),
      error: document.querySelector("#error"),
      marketValue: document.querySelector("#marketValue"),
      cost: document.querySelector("#cost"),
      profit: document.querySelector("#profit"),
      profitPercent: document.querySelector("#profitPercent"),
      positions: document.querySelector("#positions"),
      notice: document.querySelector("#notice"),
    };

    function money(value) {
      if (value === null || value === undefined) return "--";
      return new Intl.NumberFormat("zh-CN", {
        style: "currency",
        currency: "CNY",
        maximumFractionDigits: 2
      }).format(value);
    }

    function number(value, digits = 2) {
      if (value === null || value === undefined) return "--";
      return Number(value).toFixed(digits);
    }

    function signedMoney(value) {
      if (value === null || value === undefined) return "--";
      const sign = value > 0 ? "+" : "";
      return sign + money(value);
    }

    function percent(value) {
      if (value === null || value === undefined) return "--";
      const sign = value > 0 ? "+" : "";
      return `${sign}${Number(value).toFixed(2)}%`;
    }

    function tone(value) {
      if (value > 0) return "positive";
      if (value < 0) return "negative";
      return "neutral";
    }

    function signalClass(signal) {
      if (signal.includes("ST") || signal.includes("亏损") || signal.includes("跌破") || signal.includes("缺失")) {
        return "danger";
      }
      if (signal.includes("接近") || signal.includes("关注") || signal.includes("较大")) {
        return "warn";
      }
      return "";
    }

    function render(data) {
      elements.error.style.display = "none";
      elements.marketValue.textContent = money(data.totals.marketValue);
      elements.cost.textContent = money(data.totals.cost);
      elements.profit.textContent = signedMoney(data.totals.profit);
      elements.profit.className = `value ${tone(data.totals.profit)}`;
      elements.profitPercent.textContent = percent(data.totals.profitPercent);
      elements.profitPercent.className = `value ${tone(data.totals.profitPercent)}`;
      elements.timestamp.textContent = `行情时间：${data.quoteTime || "未知"} / 刷新：${data.generatedAt}`;
      elements.notice.textContent = data.disclaimer;

      elements.positions.innerHTML = data.positions.map((item) => `
        <tr>
          <td>
            <div class="stock-name">${item.name}</div>
            <div class="code">${item.code}</div>
          </td>
          <td>${number(item.currentPrice, 2)}</td>
          <td class="${tone(item.changePercent)}">${percent(item.changePercent)}</td>
          <td>${item.shares} 股<br><span class="code">成本 ${number(item.cost, 4)}</span></td>
          <td>${money(item.marketValue)}</td>
          <td class="${tone(item.profit)}">${signedMoney(item.profit)}<br><span class="code ${tone(item.profitPercent)}">${percent(item.profitPercent)}</span></td>
          <td class="weight">
            ${percent(item.weightPercent)}
            <div class="bar"><span style="width:${Math.min(item.weightPercent || 0, 100)}%"></span></div>
          </td>
          <td>
            <div class="signals">
              ${item.signals.map((signal) => `<span class="badge ${signalClass(signal)}">${signal}</span>`).join("")}
            </div>
          </td>
        </tr>
      `).join("");
    }

    async function load() {
      elements.refresh.disabled = true;
      elements.refresh.textContent = "刷新中...";
      try {
        if (window.__PORTFOLIO_DATA__) {
          render(window.__PORTFOLIO_DATA__);
          elements.timestamp.textContent = `静态快照：${window.__PORTFOLIO_DATA__.quoteTime || "未知"} / 生成：${window.__PORTFOLIO_DATA__.generatedAt}`;
          return;
        }
        const response = await fetch("/api/portfolio", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "行情接口请求失败");
        }
        render(data);
      } catch (error) {
        elements.error.textContent = `加载失败：${error.message}`;
        elements.error.style.display = "block";
      } finally {
        elements.refresh.disabled = false;
        elements.refresh.textContent = window.__PORTFOLIO_DATA__ ? "重新显示快照" : "刷新行情";
      }
    }

    elements.refresh.addEventListener("click", load);
    load();
    if (!window.__PORTFOLIO_DATA__) {
      setInterval(load, 60000);
    }
  </script>
</body>
</html>
