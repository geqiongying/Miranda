name: Cook menu alert

on:
  schedule:
    # 07:30 China Standard Time, every day.
    - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  pushplus-cook-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Require PushPlus token
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::error::仓库还没有配置 PUSHPLUS_TOKEN。"
            exit 1
          fi

      - name: Send cooking menu
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 cook_menu_alert.py
